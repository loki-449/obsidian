# 正交标签体系 —— 文献卡片 frontmatter 的取值域
#
# 设计原则：每个轴彼此正交，一篇文章在每个轴上独立取值。
# 这样 Dataview 才能做交叉筛选（"给我所有 role=方法 且 method=DMFT 且 stage=未读 的"）。
# 不要把体系、方法、用途混在一个扁平 tag 列表里 —— 那是现在 Zotero 里那堆标签的问题。

version: 1

axes:
  # 这篇文章对我的功能是什么 —— 这是你说的"功能性分化"
  role:
    multi: true          # 可多选
    values:
      - 方法         # 提供了我能直接复用的计算/分析方法
      - 数据         # 提供了实验数据或计算结果，我要引用的数字
      - 理论框架     # 提供概念、模型、物理图像
      - 综述         # 入门或全景，用来建立地图
      - 竞品         # 和我课题重叠，需要盯着
      - 工具         # 软件、代码、数据库
      - 争议         # 结论有争议或被质疑，引用时要小心

  # 材料体系
  system:
    multi: true
    open: true           # 允许出现列表外的新值
    values:
      - 镍氧化物
      - 铜氧化物
      - 铁基超导
      - 重费米子
      - 氢化物
      - kagome
      - 转角石墨烯
      - 有机超导
      - 模型体系      # 纯 Hubbard/t-J 之类，不指向具体材料

  # 技术手段
  method:
    multi: true
    open: true
    values:
      - DFT
      - DFT+U
      - DMFT
      - GW
      - QMC
      - DMRG/张量网络
      - 平均场/解析
      - 声子/电声耦合
      - 结构搜索
      - ARPES
      - STM/STS
      - 输运
      - 中子散射
      - 高压实验
      - 机器学习

  # 阅读状态
  stage:
    multi: false
    values:
      - 未读
      - 略读        # 看过摘要和图
      - 精读        # 逐段读完
      - 已消化      # 能复述、已写进自己的笔记体系

  # 与我课题的相关度，1 最低 5 最高。由打分器给初值，你可以改。
  relevance:
    multi: false
    numeric: true
    range: [1, 5]

# LLM 打标签时给模型看的说明。改这里等于改标注口径。
tagger_hint: |
  你在为一位凝聚态物理博士生（方向：强关联超导，从氢化物超导转来）标注文献。
  只依据标题和摘要判断，不要臆测摘要里没有的信息。
  role 轴回答的是"这篇对她有什么用"，不是"这篇讲了什么"。
  relevance 判据：5=直接关系到她当前课题；4=同一子方向；3=相邻方向值得知道；
  2=同领域但用处不大；1=基本无关。
  拿不准的轴留空，不要硬填。
